[project]
name = "toneguard-mcp"
version = "0.1.0"
description = "ToneGuard MCP server — multi-agent tone analysis for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    # Transitive only — reached via fastmcp -> authlib and mcp -> pyjwt[crypto],
    # never imported here. Declared anyway because it is the only floor that
    # applies on BOTH install paths. GHSA advisory (PKCS#7 EnvelopedData
    # Bleichenbacher oracle) was remediated in PR #91 by bumping uv.lock alone,
    # and a lock is not a constraint: the next unrelated `uv lock` can resolve
    # back under it, and the README's `pip install -e ".[dev]"` never reads the
    # lock at all. Remove this line only when a direct dependency declares a
    # floor of its own at >=50.
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
