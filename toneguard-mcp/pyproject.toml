[project]
name = "toneguard-mcp"
version = "0.1.0"
description = "ToneGuard MCP server — multi-agent tone analysis for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    # Transitive only — reached via fastmcp -> authlib and mcp -> pyjwt[crypto],
    # never imported by this package. Declared anyway because it is the only
    # floor that applies on BOTH documented install paths.
    #
    # GHSA-g6cj-pr64-35w5 / CVE-2026-69247 (high): PKCS#7 EnvelopedData
    # decryption exposes a Bleichenbacher oracle through distinguishable errors
    # and timing. First patched in 50.0.0, which is where this floor comes from
    # — it is the advisory's fix version, not a round-up to whatever the lock
    # happened to hold.
    #
    # PR #91 remediated it by bumping uv.lock alone, and a lock is not a
    # constraint: the next unrelated `uv lock` can resolve back under it, and
    # the README's `pip install -e ".[dev]"` never reads the lock at all.
    #
    # Remove this line when nothing ELSE in the resolved tree requires
    # cryptography any more. Check with `uv tree --invert --package
    # cryptography`, which lists dependents. Today that prints three branches:
    # authlib (under fastmcp), pyjwt[crypto] (under mcp), and a bare
    # toneguard-mcp edge that exists only because of the line below. When the
    # authlib and pyjwt branches are gone and that bare edge is all that
    # remains, the floor is protecting nothing and can go. Plain `uv tree`
    # cannot answer this — cryptography always appears there, for the same
    # reason.
    #
    # Do NOT remove it merely because some package in the chain grows a floor
    # of its own: uv.lock records registry edges without specifiers, so that
    # condition is not checkable from here.
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
