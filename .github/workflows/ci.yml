name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # node 20 bundles npm 10.8.2, and `npm ci` below refuses without this step.
      # On THIS runtime the refusal comes from engine-strict in .npmrc plus
      # engines.npm — NOT from devEngines, which npm below 10.9 ignores entirely
      # (measured: 10.8.2 ignored it and stripped all 10 libc fields while
      # reporting success). Both declarations exist and neither is redundant;
      # see .npmrc for which one fires where.
      #
      # The floor exists because npm 10 silently strips the "libc" platform
      # fields npm 11 writes into package-lock.json — that already landed on
      # main once (952e9fd, 2026-04-03, -10 entries). Bumping node-version
      # instead would also clear it; this keeps the runtime CI tests on
      # unchanged.
      - name: Use npm 11 (required by the engines floor)
        run: npm install -g npm@11
      - name: Install JS deps
        run: npm ci
      - name: Vitest
        run: node node_modules/.bin/vitest run
      - name: Shared artifacts freshness
        run: node scripts/generate_shared_artifacts.mjs --check
      - name: Parity scan (canonical + client drift)
        run: node scripts/parity_scan.mjs --check

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install MCP deps
        working-directory: toneguard-mcp
        run: uv sync --extra dev
      - name: MCP pytest
        working-directory: toneguard-mcp
        run: uv run --extra dev pytest tests/ -v --ignore=tests/test_live_integration.py
